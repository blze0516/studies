name: backend-interview-lab

services:
  postgres:
    image: postgres:18.6
    profiles: ["db"]
    environment:
      POSTGRES_DB: backend_interview
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.10.1
    profiles: ["cache"]
    ports:
      - "6379:6379"

volumes:
  postgres-data:
